name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with tunic.exe'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag name (used when create_release is true)'
        required: false
        default: 'v0.3.0-fedora45'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate PowerShell scripts and templates
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'

        $err = $null
        [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\tunic.ps1'), [ref]$null, [ref]$err)
        if ($err) { $err; exit 1 }

        [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\files\distros.ps1'), [ref]$null, [ref]$err)
        if ($err) { $err; exit 1 }

        powershell -NoProfile -ExecutionPolicy Bypass -File .\tunic.ps1 noop
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $tz = powershell -NoProfile -ExecutionPolicy Bypass -File .\tunic.ps1 tz
        if (-not $tz -or $tz -match '\s') {
          throw "Invalid timezone output: '$tz'"
        }
        Write-Host "Timezone check OK: $tz"

        $distros = . .\files\distros.ps1
        if (-not $distros -or $distros.Count -lt 1) {
          throw "No distros loaded from files/distros.ps1"
        }
        Write-Host "Loaded $($distros.Count) distros. First: $($distros[0].name)"

        foreach ($f in @('.\files\grub.fedora.cfg', '.\files\ks.cfg', '.\files\grub.cfg', '.\files\preseed.cfg', '.\run-tunic.bat', '.\tunic.nsi')) {
          if (-not (Test-Path -LiteralPath $f)) {
            throw "Missing required file: $f"
          }
        }

        $grubCfg = Get-Content -LiteralPath '.\files\grub.fedora.cfg' -Raw
        if ($grubCfg -match '(?m)^\s*insmod\s') {
          throw "files/grub.fedora.cfg must not invoke insmod under Secure Boot"
        }
        Write-Host "All Tunic CI checks passed."

    - name: Go vet check
      shell: powershell
      run: |
        if (Get-Command go -ErrorAction SilentlyContinue) {
          $env:GO111MODULE = 'off'
          go vet .
        } else {
          Write-Host "Go not installed on runner, skipping."
        }

    - name: Build tunic.exe with NSIS
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $makensis = Get-Command makensis -ErrorAction SilentlyContinue
        if (-not $makensis) {
          choco install -y nsis --no-progress | Out-Host
          $nsisBin = 'C:\Program Files (x86)\NSIS\makensis.exe'
        } else {
          $nsisBin = $makensis.Source
        }
        if (-not (Test-Path -LiteralPath $nsisBin)) {
          throw "makensis.exe not found at $nsisBin"
        }
        & $nsisBin /V2 tunic.nsi
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath '.\tunic.exe')) {
          throw "NSIS build failed (exit $LASTEXITCODE)"
        }
        Get-Item .\tunic.exe | Select-Object Name, Length

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: tunic-windows
        path: |
          tunic.exe
          run-tunic.bat

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
          $env:GITHUB_REF -replace '^refs/tags/', ''
        } else {
          '${{ inputs.release_tag }}'
        }
        $exists = $true
        try { gh release view $tag 2>$null | Out-Null } catch { $exists = $false }
        if ($LASTEXITCODE -ne 0) { $exists = $false }

        if ($exists) {
          gh release upload $tag tunic.exe run-tunic.bat --clobber
        } else {
          gh release create $tag tunic.exe run-tunic.bat `
            --title "Tunic $tag" `
            --notes "Automated Windows 10/11 build with Fedora 45 drop-in ISO support."
        }
