# Tunic Linux Installer for Windows - Fedora Kickstart Template
# Used for Fedora Server / Everything / Netinstall ISOs (Fedora Live ISOs use Anaconda WebUI interactively)
# Copyright (c) Michael Slattery under GPLv3 with NO warranty.

lang {{LANG}}
keyboard --vckeymap=us --xlayouts='us'
timezone {{TIMEZONE}} {{UTC_FLAG}}

network --bootproto=dhcp --activate --hostname={{HOSTNAME}}

rootpw --lock
user --name={{USERNAME}} --password={{PASSWORD}} --plaintext --groups=wheel --gecos="{{FULLNAME}}"

firewall --enabled
selinux --enforcing

{{PARTITION_CMDS}}

reboot
