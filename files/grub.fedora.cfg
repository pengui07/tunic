set timeout=5
set default=0

menuentry "{{PRIMARY_TITLE}}" {
    search --no-floppy --file --set=root /.tunic-fedora-boot
    {{LINUX_CMD}} {{KERNEL_PATH}} {{PRIMARY_ARGS}}
    {{INITRD_CMD}} {{INITRD_PATH}}
}

menuentry "{{ALT_TITLE}}" {
    search --no-floppy --file --set=root /.tunic-fedora-boot
    {{LINUX_CMD}} {{KERNEL_PATH}} {{ALT_ARGS}}
    {{INITRD_CMD}} {{INITRD_PATH}}
}

menuentry "{{NOMODESET_TITLE}}" {
    search --no-floppy --file --set=root /.tunic-fedora-boot
    {{LINUX_CMD}} {{KERNEL_PATH}} {{NOMODESET_ARGS}}
    {{INITRD_CMD}} {{INITRD_PATH}}
}

menuentry "Microsoft Windows" {
    search --no-floppy --file --set=root /EFI/Microsoft/Boot/bootmgfw.efi
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "UEFI Firmware Settings" {
    fwsetup
}
